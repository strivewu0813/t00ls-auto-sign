; ============================================================================
; T00ls 自动签到脚本配置示例
; 复制为 config.ini 后修改，并确保权限为 600：chmod 600 config.ini
; 所有 [t00ls] 项都可以用环境变量覆盖（T00LS_USERNAME / T00LS_PASSWORD_MD5 ...）
; ============================================================================

[t00ls]
; 接口域名，一般不用改（历史脚本里的 www.t00ls.net 会跳转到 .com）
base_url = https://www.t00ls.com

; ---- 方式一（推荐）：账号密码 + 安全提问 ----
username = your_username
; 明文密码（脚本会自己算 MD5），或者直接用下面的 password_md5 二选一
password = your_password
; 32 位小写 MD5，可用命令生成：echo -n '你的密码' | md5sum
; 填了 password_md5 就以它为准
password_md5 =

; 安全提问编号，见下方对照表；没有安全提问就填 0
;   0 = 没有安全提问        1 = 母亲的名字
;   2 = 爷爷的名字          3 = 父亲出生的城市
;   4 = 您其中一位老师的名字 5 = 您个人计算机的型号
;   6 = 您最喜欢的餐馆名称   7 = 驾驶执照的最后四位数字
question_id = 0
question_answer =

; ---- 方式二（备选）：直接用浏览器 Cookie ----
; 浏览器登录 t00ls 后 F12 -> Network -> 任意请求 -> 复制 Request Headers 里的 Cookie
; 注意：Cookie 会过期（通常几十天），失效后脚本会报 loginfirst
; 两个方式同时存在时，cookie 优先
cookie =

; 单次请求超时（秒）与失败重试次数
timeout = 20
retries = 3

; 日志文件；留空则只输出到 stdout（systemd 下用 journalctl 查看）
log_file = /var/log/t00ls-sign.log

; 状态文件：记录「最后一次确认已签到的日期/累计签到次数」和「每天是否已补签」，
; 用于判断中间有没有漏签，以及保证一天最多补签一次（定时器一天会触发 3 次）。
; 留空则默认放在配置文件同目录下的 t00ls-state.json
state_file =

; ---- 自动补签（每次消耗 20 TuBi，默认关闭） ----
; 打开后：只有"确实检测到漏签"才会补，且每天最多补一次；
; 判断依据是站点自己的累计签到次数，所以本机停机几天也不会算错。
; 手动补一次而不改配置：python3 t00ls_sign.py -c config.ini --bu-sign
auto_bu_sign = false
; 漏签天数超过这个值就放弃自动补（久远的日期多半不允许补，避免白扣 TuBi）
bu_sign_within_days = 3

; ---- 刚过零点（北京 00:05 这类定时）时的保护 ----
; 站点若还没换日，接口会返回昨天的 sign_today=1。脚本发现"累计签到次数与昨天相同"
; 就判定是残留状态，等待后重试签到；真没换日时接口只回 alreadysign，不会重复计数。
; 可用 --stale-retries / --stale-wait 临时覆盖。
stale_retries = 3
stale_wait = 120


[notify]
; 是否需要通知；channels 支持：dingtalk, wecom, serverchan, bark, telegram, mail
; 签到成功/失败都会通知；只填了 webhook 才会真正发送（缺配置的渠道会在启动时提示并跳过）
enabled = true
channels = dingtalk
; 今日已签到（重复触发）时是否也发通知，默认只在"签到成功 / 失败 / 补签"时通知
always = false

; ---- 钉钉群机器人 webhook（推荐） ----
; 钉钉群 -> 群设置 -> 智能群助手 -> 添加机器人 -> 自定义 -> 复制 Webhook 地址
; 安全设置「自定义关键词」：关键词填 T00ls（通知标题固定以 T00ls 开头），secret 留空
; 安全设置「加签」      ：webhook 填干净的地址，再把 SEC 开头的密钥填到 dingtalk_secret
; 安全设置「IP 白名单」 ：不支持（脚本所在服务器没有固定出口 IP）
dingtalk_webhook =
; 加签密钥，形如 SECxxxxxxxx（很长，别漏字符/别带空格）；用关键词模式则留空
dingtalk_secret =
wecom_webhook =

; 配好后自测：python3 t00ls_sign.py -c config.ini --test-notify
; （只发一条测试消息，不登录、不访问站点；加签模式报 310000 时先检查服务器时间 timedatectl）

; ---- Server 酱（sctapi.ftqq.com）SendKey ----
serverchan_key =

; ---- Bark（iOS），例如 https://api.day.app/你的key（脚本走 JSON POST 推送） ----
bark_url =

; ---- Telegram ----
telegram_token =
telegram_chat_id =

; ---- 邮件（QQ 邮箱示例：smtp.qq.com / 465 / 授权码） ----
smtp_host =
smtp_port = 465
smtp_ssl = true
smtp_user =
smtp_password =
mail_from =
mail_to =
